[theme]
base = "dark"
primaryColor = "#7C83FD"
backgroundColor = "#090E1A"
secondaryBackgroundColor = "#121A2B"
textColor = "#F4F7FB"
linkColor = "#7EE8CF"
borderColor = "#26334A"
showWidgetBorder = true
baseRadius = "0.9rem"
buttonRadius = "full"
font = "sans-serif"
headingFont = "sans-serif"

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
maxUploadSize = 25
